# Builds Renuxcord on every push to main and publishes it as the rolling "devbuild" release.
# Installed Renuxcord clients check that release to update themselves.
name: Renuxcord Release
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/renuxcord-release.yml
            - src/**
            - browser/**
            - mcp/**
            - installer/**
            - scripts/**
            - package.json
            - pnpm-lock.yaml
    workflow_dispatch:

concurrency:
    group: renuxcord-release
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    build:
        if: github.repository != 'Vendicated/Vencord'
        runs-on: ubuntu-latest
        outputs:
            hash: ${{ steps.hash.outputs.hash }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile
                  pnpm install --dir mcp --ignore-workspace --frozen-lockfile

            - name: Commit hash
              id: hash
              run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Typecheck
              run: pnpm test:ts

            - name: Test the AI bridge and MCP server
              run: node mcp/test/smoke.mjs

            - name: Build
              run: pnpm build --standalone
              env:
                  VENCORD_HASH: ${{ steps.hash.outputs.hash }}

            - name: Build the MCP server
              run: node scripts/renuxcord/buildMcp.mjs

            # browser.js/css are what the Android and iOS apps load, Renuxcord.user.js is for userscript managers
            - name: Build the web version
              run: pnpm buildWeb --standalone
              env:
                  VENCORD_HASH: ${{ steps.hash.outputs.hash }}

            - name: Clean up
              run: |
                  cp scripts/renuxcord/install.sh dist/install.sh
                  mv dist/Vencord.user.js dist/Renuxcord.user.js
                  rm -rf dist/*-unpacked dist/vendor dist/vencordDesktop* dist/Installer dist/extension* dist/Vencord.user.* dist/browser.*.map dist/browser.js.LEGAL.txt

            - name: Upload build
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    installer:
        if: github.repository != 'Vendicated/Vencord'
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build the installer
              shell: pwsh
              run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 -Repo "${{ github.repository }}" -Out dist/RenuxcordInstaller.exe

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: installer
                  path: dist/RenuxcordInstaller.exe

    installer-mac:
        if: github.repository != 'Vendicated/Vencord'
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Go
              uses: actions/setup-go@v5
              with:
                  go-version: stable
                  cache-dependency-path: installer/desktop/go.mod

            - name: Build Renuxcord Installer for macOS
              run: sh installer/desktop/build.sh

            - name: Upload it
              uses: actions/upload-artifact@v4
              with:
                  name: installer-mac
                  path: dist/RenuxcordInstaller-mac.zip

    installer-linux:
        if: github.repository != 'Vendicated/Vencord'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Go
              uses: actions/setup-go@v5
              with:
                  go-version: stable
                  cache-dependency-path: installer/desktop/go.mod

            - name: Build Renuxcord Installer for Linux
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols
                  go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
                  sh installer/desktop/build.sh

            - name: Upload it
              uses: actions/upload-artifact@v4
              with:
                  name: installer-linux
                  path: dist/RenuxcordInstaller-linux-x64.*

    release:
        needs: [build, installer, installer-mac, installer-linux]
        runs-on: ubuntu-latest

        steps:
            - name: Download build
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Download installer
              uses: actions/download-artifact@v4
              with:
                  name: installer
                  path: dist

            - name: Download the macOS installer
              uses: actions/download-artifact@v4
              with:
                  name: installer-mac
                  path: dist

            - name: Download the Linux installer
              uses: actions/download-artifact@v4
              with:
                  name: installer-linux
                  path: dist

            - name: Publish DevBuild
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  HASH: ${{ needs.build.outputs.hash }}
              run: |
                  cat > notes.md << 'EOF'
                  Rolling Renuxcord build. Installed clients update from here by themselves.

                  - **Windows:** download **RenuxcordInstaller.exe** and run it.
                  - **macOS:** download **RenuxcordInstaller-mac.zip**, open it and run Renuxcord Installer. The first time, macOS blocks it: System Settings › Privacy & Security › Open Anyway.
                  - **Linux:** install **RenuxcordInstaller-linux-x64.deb** (Ubuntu, Debian, Mint) or **.rpm** (Fedora, openSUSE), then open Renuxcord Installer from your apps. Anything else: the **.tar.gz**.
                  - **macOS and Linux from a terminal:** `curl -fsSL https://github.com/Renuxchan/Renuxcord/releases/download/devbuild/install.sh | sh`
                  - **Android:** install **Renuxcord.apk**.
                  - **iPhone and iPad:** open renuxchan.github.io/Renuxcord on your iPhone and tap Add to SideStore, Add to AltStore or Install with TrollStore (the source is **altstore.json**). Or sideload **Renuxcord.ipa** yourself. No sideloading? Install the free Userscripts app, add **Renuxcord.user.js** and open discord.com in Safari.
                  - **Any desktop browser:** open **Renuxcord.user.js** with Tampermonkey.
                  EOF
                  if ! gh release view devbuild > /dev/null 2>&1; then
                      gh release create devbuild --target "$GITHUB_SHA" --title "DevBuild $HASH" --latest --notes-file notes.md
                  fi
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "DevBuild $HASH" --latest --notes-file notes.md
