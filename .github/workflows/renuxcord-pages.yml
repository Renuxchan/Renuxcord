# Builds and publishes the Renuxcord download site (site/) to GitHub Pages
name: Renuxcord Site
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/renuxcord-pages.yml
            - site/**
            - src/plugins/**
    workflow_dispatch:

concurrency:
    group: renuxcord-pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        if: github.repository != 'Vendicated/Vencord'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate the plugin list
              run: pnpm generatePluginJson site/plugins.json site/plugin-readmes.json

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Upload site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
